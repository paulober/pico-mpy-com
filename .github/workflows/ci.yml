name: CI

on:
  push:
    branches: [main]
  pull_request: ~

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  integration:
    name: Integration (MicroPython simulator)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      # The Ubuntu apt `micropython` is linked against GNU readline, which binds
      # Ctrl-A to "beginning-of-line" and swallows it — so it never reaches the
      # interpreter's raw-REPL entry, which the library requires. Build the Unix
      # port from source instead: its default build uses the internal readline
      # and therefore supports the raw REPL.
      - name: Install build tools + socat
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libffi-dev pkg-config socat git

      - name: Cache MicroPython Unix binary
        id: mpy-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mpy-bin
          key: micropython-unix-v1.25.0

      - name: Build MicroPython Unix port (raw-REPL capable)
        if: steps.mpy-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.25.0 \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/micropython"
          make -C "$RUNNER_TEMP/micropython/mpy-cross" -j"$(nproc)"
          make -C "$RUNNER_TEMP/micropython/ports/unix" submodules
          make -C "$RUNNER_TEMP/micropython/ports/unix" -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/mpy-bin"
          cp "$RUNNER_TEMP/micropython/ports/unix/build-standard/micropython" \
            "$RUNNER_TEMP/mpy-bin/micropython"

      - name: Install MicroPython on PATH
        run: |
          sudo install "$RUNNER_TEMP/mpy-bin/micropython" /usr/local/bin/micropython
          micropython --version
          micropython -c "print('micropython ready')"

      - name: Install dependencies
        run: npm ci

      - name: Integration tests (against the simulator)
        run: npm run test:integration
